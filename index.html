<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Speed Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%232979ff' stroke-width='8'/><line x1='50' y1='50' x2='75' y2='30' stroke='%2364b5f6' stroke-width='6' stroke-linecap='round'/></svg>">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    ::selection {
      background: rgba(41, 121, 255, 0.3);
      color: #fff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #162a3a 0%, #0f1923 60%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button {
      touch-action: manipulation;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
      padding-left: max(1.5rem, env(safe-area-inset-left));
      padding-right: max(1.5rem, env(safe-area-inset-right));
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #90caf9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #607d8b;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }

    /* Per-metric accent colors */
    .metric-card[data-metric="download"] { --accent: #00b4d8; }
    .metric-card[data-metric="upload"] { --accent: #7c3aed; }
    .metric-card[data-metric="ping"] { --accent: #f59e0b; }
    .metric-card[data-metric="jitter"] { --accent: #ec4899; }

    /* Keyframes */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(41, 121, 255, 0.3), 0 0 0 6px rgba(41, 121, 255, 0.08); }
      50% { box-shadow: 0 0 50px rgba(41, 121, 255, 0.5), 0 0 80px rgba(41, 121, 255, 0.15), 0 0 0 6px rgba(41, 121, 255, 0.15); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* Hero button */
    .hero-btn {
      background: linear-gradient(135deg, #2979ff, #1565c0);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 160px;
      height: 160px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 40px rgba(41, 121, 255, 0.35), 0 0 0 6px rgba(41, 121, 255, 0.1);
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .hero-btn:not(:disabled):not(.testing) {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .hero-btn::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 2px solid rgba(41, 121, 255, 0.2);
      transition: border-color 0.3s;
    }

    .hero-btn::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 3px solid transparent;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .hero-btn.testing::after {
      opacity: 1;
      border-top-color: #64b5f6;
      border-right-color: #42a5f5;
      animation: spin 1.2s linear infinite;
    }

    .hero-btn:hover:not(:disabled):not(.testing) {
      transform: scale(1.07);
      box-shadow: 0 0 60px rgba(41, 121, 255, 0.5), 0 0 0 6px rgba(41, 121, 255, 0.2);
      animation: none;
    }

    .hero-btn:hover:not(:disabled)::before {
      border-color: rgba(41, 121, 255, 0.5);
    }

    .hero-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hero-btn:focus-visible {
      outline: 3px solid #64b5f6;
      outline-offset: 8px;
    }

    .hero-btn .spinner {
      display: none;
    }

    .hero-btn.testing .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 4px;
    }

    .hero-btn.testing .btn-label {
      font-size: 0.85rem;
    }

    /* Cancel button */
    .cancel-btn {
      background: transparent;
      color: #ef5350;
      border: 1px solid #ef5350;
      border-radius: 6px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: background 0.2s, opacity 0.3s ease, visibility 0.3s;
      opacity: 0;
      visibility: hidden;
    }

    .cancel-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .cancel-btn:hover {
      background: rgba(239, 83, 80, 0.15);
    }

    /* Metric cards grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      width: 100%;
      margin-top: 0.5rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: linear-gradient(165deg, #1e2f3d 0%, #1a2733 100%);
      border-radius: 16px;
      padding: 1.4rem 1.2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s ease;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeInUp 0.5s ease forwards;
    }

    .metric-card:nth-child(1) { animation-delay: 0.1s; }
    .metric-card:nth-child(2) { animation-delay: 0.2s; }
    .metric-card:nth-child(3) { animation-delay: 0.3s; }
    .metric-card:nth-child(4) { animation-delay: 0.4s; }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent, #2979ff), transparent);
      border-radius: 2px;
      opacity: 0.4;
      transition: opacity 0.3s, left 0.3s, right 0.3s;
    }

    .metric-card:hover::before,
    .metric-card.active::before {
      opacity: 1;
      left: 10%;
      right: 10%;
    }

    .metric-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .metric-card.active {
      border-color: var(--accent, #2979ff);
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(41, 121, 255, 0.12);
    }

    .metric-card[data-metric="download"].active { box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 180, 216, 0.15); }
    .metric-card[data-metric="upload"].active { box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(124, 58, 237, 0.15); }
    .metric-card[data-metric="ping"].active { box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(245, 158, 11, 0.15); }
    .metric-card[data-metric="jitter"].active { box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3), 0 0 20px rgba(236, 72, 153, 0.15); }

    .metric-card.error {
      border-color: #ef5350;
    }

    .metric-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 0.3rem;
    }

    .metric-icon {
      font-size: 1.3rem;
      color: var(--accent, #2979ff);
    }

    .metric-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #90a4ae;
    }

    .metric-desc {
      font-size: 0.65rem;
      color: #607d8b;
      margin-bottom: 0.8rem;
    }

    .metric-value {
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      min-height: 2.6rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.3rem;
    }

    .metric-value .number {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .metric-value .unit {
      font-size: 0.75rem;
      font-weight: 500;
      color: #607d8b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value .placeholder {
      color: #37474f;
      font-size: 2rem;
    }

    .metric-value .card-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #263843;
      border-top-color: var(--accent, #2979ff);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .result-appear {
      animation: countUp 0.4s ease forwards;
    }

    /* Color coding for results */
    .result-excellent .number { color: #4caf50; }
    .result-good .number { color: #8bc34a; }
    .result-fair .number { color: #ffc107; }
    .result-poor .number { color: #ef5350; }

    /* Quality badge pills */
    .metric-quality {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
      padding: 0 0;
      border-radius: 10px;
      min-height: 1.2rem;
      transition: all 0.3s ease;
    }

    .metric-quality:not(:empty) {
      padding: 0.2rem 0.6rem;
    }

    .metric-quality:not(:empty)::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 0.3rem;
      vertical-align: middle;
      background: currentColor;
    }

    .result-excellent .metric-quality {
      color: #4caf50;
      background: rgba(76, 175, 80, 0.12);
      border: 1px solid rgba(76, 175, 80, 0.25);
    }
    .result-good .metric-quality {
      color: #8bc34a;
      background: rgba(139, 195, 74, 0.12);
      border: 1px solid rgba(139, 195, 74, 0.25);
    }
    .result-fair .metric-quality {
      color: #ffc107;
      background: rgba(255, 193, 7, 0.12);
      border: 1px solid rgba(255, 193, 7, 0.25);
    }
    .result-poor .metric-quality {
      color: #ef5350;
      background: rgba(239, 83, 80, 0.12);
      border: 1px solid rgba(239, 83, 80, 0.25);
    }

    /* Progress bar */
    .progress-bar {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      height: 6px;
      width: 100%;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--accent, #2979ff);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 3px;
      position: relative;
    }

    .metric-card.active .progress-fill {
      background: linear-gradient(
        90deg,
        var(--accent, #2979ff) 0%,
        color-mix(in srgb, var(--accent, #2979ff) 60%, white) 50%,
        var(--accent, #2979ff) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    /* Section label */
    .individual-tests-section {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6274;
      margin-bottom: 0.5rem;
      display: block;
    }

    /* Individual test buttons */
    .individual-tests {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .test-btn {
      background: #1a2733;
      color: #90a4ae;
      border: 1px solid #263843;
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .test-btn:hover:not(:disabled) {
      background: #263843;
      color: #e0e0e0;
      border-color: #37474f;
    }

    .test-btn[data-metric="download"]:hover:not(:disabled) { border-color: #00b4d8; color: #00b4d8; }
    .test-btn[data-metric="upload"]:hover:not(:disabled) { border-color: #7c3aed; color: #7c3aed; }
    .test-btn[data-metric="ping"]:hover:not(:disabled) { border-color: #f59e0b; color: #f59e0b; }
    .test-btn[data-metric="jitter"]:hover:not(:disabled) { border-color: #ec4899; color: #ec4899; }

    .test-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .test-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }

    /* Error message */
    .error-msg {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.3);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      color: #ef9a9a;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      width: 100%;
    }

    .error-msg.visible {
      display: block;
    }

    .error-msg button {
      background: transparent;
      color: #ef5350;
      border: 1px solid #ef5350;
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .error-msg button:hover {
      background: rgba(239, 83, 80, 0.15);
    }

    /* Status text */
    .status-text {
      font-size: 0.85rem;
      color: #607d8b;
      margin-bottom: 1rem;
      min-height: 1.2rem;
      text-align: center;
    }

    /* Server info */
    .server-info {
      font-size: 0.75rem;
      color: #607d8b;
      margin-bottom: 0.5rem;
    }

    /* Copy button */
    .copy-btn {
      background: #1a2733;
      color: #90a4ae;
      border: 1px solid #263843;
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s, background 0.2s, color 0.2s;
    }

    .copy-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .copy-btn:hover {
      background: #263843;
      color: #e0e0e0;
    }

    .copy-btn:focus-visible {
      outline: 2px solid #64b5f6;
      outline-offset: 2px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.75rem;
      color: #3a5060;
    }

    footer a {
      color: #2979ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer p {
      margin: 0.2rem 0;
    }

    /* Responsive - Tablet */
    @media (min-width: 481px) and (max-width: 768px) {
      main {
        max-width: 600px;
        padding: 2rem 1.25rem;
      }
    }

    /* Responsive - Mobile */
    @media (max-width: 480px) {
      .metrics-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .hero-btn {
        width: 140px;
        height: 140px;
        font-size: 1rem;
      }

      .metric-card {
        padding: 1.2rem 1rem;
      }

      .metric-value {
        font-size: 2.2rem;
      }

      main {
        padding: 1.5rem 1rem;
      }

      .individual-tests {
        flex-direction: column;
        align-items: stretch;
      }

      .test-btn {
        width: 100%;
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
        min-height: 44px;
      }

      .cancel-btn {
        padding: 0.5rem 1.5rem;
        min-height: 44px;
      }

      .copy-btn {
        padding: 0.6rem 1.5rem;
        min-height: 44px;
        width: 100%;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .metric-card {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Speed Test</h1>
    <p class="subtitle">Test your connection speed</p>

    <button class="hero-btn" id="allBtn" aria-label="Run all speed tests">
      <div class="spinner"></div>
      <div class="btn-label">Test All</div>
    </button>

    <button class="cancel-btn" id="cancelBtn">Cancel</button>

    <div class="status-text" id="statusText" aria-live="polite"></div>

    <div class="error-msg" id="errorMsg" role="alert">
      <div id="errorText"></div>
      <button id="retryBtn">Try Again</button>
    </div>

    <div class="metrics-grid">
      <div class="metric-card" id="downloadCard" data-metric="download">
        <div class="metric-header">
          <span class="metric-icon" aria-hidden="true">&#x2B07;</span>
          <span class="metric-label">Download</span>
        </div>
        <div class="metric-desc">How fast you receive data</div>
        <div class="metric-value" id="downloadValue" aria-label="Download speed">
          <span class="placeholder">&mdash;</span>
        </div>
        <div class="metric-quality" id="downloadQuality"></div>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="downloadBar">
          <div class="progress-fill" id="downloadProgress"></div>
        </div>
      </div>

      <div class="metric-card" id="uploadCard" data-metric="upload">
        <div class="metric-header">
          <span class="metric-icon" aria-hidden="true">&#x2B06;</span>
          <span class="metric-label">Upload</span>
        </div>
        <div class="metric-desc">How fast you send data</div>
        <div class="metric-value" id="uploadValue" aria-label="Upload speed">
          <span class="placeholder">&mdash;</span>
        </div>
        <div class="metric-quality" id="uploadQuality"></div>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="uploadBar">
          <div class="progress-fill" id="uploadProgress"></div>
        </div>
      </div>

      <div class="metric-card" id="pingCard" data-metric="ping">
        <div class="metric-header">
          <span class="metric-icon" aria-hidden="true">&#x1F4E1;</span>
          <span class="metric-label">Ping</span>
        </div>
        <div class="metric-desc">Delay to the server</div>
        <div class="metric-value" id="pingValue" aria-label="Ping latency">
          <span class="placeholder">&mdash;</span>
        </div>
        <div class="metric-quality" id="pingQuality"></div>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="pingBar">
          <div class="progress-fill" id="pingProgress"></div>
        </div>
      </div>

      <div class="metric-card" id="jitterCard" data-metric="jitter">
        <div class="metric-header">
          <span class="metric-icon" aria-hidden="true">&#x2248;</span>
          <span class="metric-label">Jitter</span>
        </div>
        <div class="metric-desc">Variation in response time</div>
        <div class="metric-value" id="jitterValue" aria-label="Jitter">
          <span class="placeholder">&mdash;</span>
        </div>
        <div class="metric-quality" id="jitterQuality"></div>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="jitterBar">
          <div class="progress-fill" id="jitterProgress"></div>
        </div>
      </div>
    </div>

    <div class="server-info" id="serverInfo"></div>

    <button class="copy-btn" id="copyBtn">Copy Results</button>

    <div class="individual-tests-section">
      <span class="section-label">Individual Tests</span>
      <div class="individual-tests">
        <button class="test-btn" id="downloadBtn" data-metric="download">Download Only</button>
        <button class="test-btn" id="uploadBtn" data-metric="upload">Upload Only</button>
        <button class="test-btn" id="pingBtn" data-metric="ping">Ping Only</button>
        <button class="test-btn" id="jitterBtn" data-metric="jitter">Jitter Only</button>
      </div>
    </div>
  </main>

  <footer>
    <p>Written by Nick Hernandez</p>
    <p>Source code on <a href="https://github.com/djlactose/speedtest" target="_blank" rel="noopener">GitHub</a> &middot; MIT License</p>
  </footer>

  <script>
    // DOM elements
    const allBtn = document.getElementById('allBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const retryBtn = document.getElementById('retryBtn');
    const testBtns = document.querySelectorAll('.test-btn');
    const serverInfo = document.getElementById('serverInfo');
    const copyBtn = document.getElementById('copyBtn');

    let serverName = '';

    const cards = {
      download: {
        card: document.getElementById('downloadCard'),
        value: document.getElementById('downloadValue'),
        quality: document.getElementById('downloadQuality'),
        progress: document.getElementById('downloadProgress'),
        bar: document.getElementById('downloadBar')
      },
      upload: {
        card: document.getElementById('uploadCard'),
        value: document.getElementById('uploadValue'),
        quality: document.getElementById('uploadQuality'),
        progress: document.getElementById('uploadProgress'),
        bar: document.getElementById('uploadBar')
      },
      ping: {
        card: document.getElementById('pingCard'),
        value: document.getElementById('pingValue'),
        quality: document.getElementById('pingQuality'),
        progress: document.getElementById('pingProgress'),
        bar: document.getElementById('pingBar')
      },
      jitter: {
        card: document.getElementById('jitterCard'),
        value: document.getElementById('jitterValue'),
        quality: document.getElementById('jitterQuality'),
        progress: document.getElementById('jitterProgress'),
        bar: document.getElementById('jitterBar')
      }
    };

    let abortController = null;
    let isTesting = false;
    let lastTestFn = null;

    // Quality thresholds
    function getSpeedQuality(mbps) {
      if (mbps >= 100) return { cls: 'result-excellent', label: 'Excellent' };
      if (mbps >= 50) return { cls: 'result-good', label: 'Good' };
      if (mbps >= 25) return { cls: 'result-fair', label: 'Fair' };
      return { cls: 'result-poor', label: 'Poor' };
    }

    function getPingQuality(ms) {
      if (ms <= 20) return { cls: 'result-excellent', label: 'Excellent' };
      if (ms <= 50) return { cls: 'result-good', label: 'Good' };
      if (ms <= 100) return { cls: 'result-fair', label: 'Fair' };
      return { cls: 'result-poor', label: 'Poor' };
    }

    function getJitterQuality(ms) {
      if (ms <= 5) return { cls: 'result-excellent', label: 'Excellent' };
      if (ms <= 15) return { cls: 'result-good', label: 'Good' };
      if (ms <= 30) return { cls: 'result-fair', label: 'Fair' };
      return { cls: 'result-poor', label: 'Poor' };
    }

    // UI helpers
    function setButtonsDisabled(disabled) {
      allBtn.disabled = disabled;
      testBtns.forEach(b => b.disabled = disabled);
    }

    function setTesting(active, label) {
      isTesting = active;
      setButtonsDisabled(active);
      cancelBtn.classList.toggle('visible', active);
      allBtn.classList.toggle('testing', active);
      if (active) {
        allBtn.querySelector('.btn-label').textContent = label || 'Testing...';
        abortController = new AbortController();
      } else {
        allBtn.querySelector('.btn-label').textContent = 'Test All';
        abortController = null;
      }
    }

    function showError(message) {
      errorText.textContent = message;
      errorMsg.classList.add('visible');
    }

    function hideError() {
      errorMsg.classList.remove('visible');
    }

    function setStatus(msg) {
      statusText.textContent = msg;
    }

    function setCardActive(key) {
      Object.values(cards).forEach(c => c.card.classList.remove('active'));
      if (key) cards[key].card.classList.add('active');
    }

    function setCardError(key) {
      cards[key].card.classList.add('error');
    }

    function updateProgress(key, pct) {
      const p = Math.min(Math.max(pct, 0), 100);
      cards[key].progress.style.width = p + '%';
      cards[key].bar.setAttribute('aria-valuenow', Math.round(p));
    }

    function showSpinner(key) {
      cards[key].value.innerHTML = '<div class="card-spinner"></div>';
    }

    function showResult(key, number, unit, qualityFn) {
      const q = qualityFn(parseFloat(number));
      cards[key].card.className = 'metric-card ' + q.cls;
      cards[key].card.setAttribute('data-metric', key);
      cards[key].value.innerHTML = '<span class="number">' + number + '</span><span class="unit">' + unit + '</span>';
      cards[key].value.classList.add('result-appear');
      cards[key].quality.textContent = q.label;
    }

    function resetCard(key) {
      cards[key].card.className = 'metric-card';
      cards[key].card.setAttribute('data-metric', key);
      cards[key].value.innerHTML = '<span class="placeholder">&mdash;</span>';
      cards[key].value.classList.remove('result-appear');
      cards[key].quality.textContent = '';
      updateProgress(key, 0);
    }

    function resetAll() {
      ['download', 'upload', 'ping', 'jitter'].forEach(resetCard);
      hideError();
      setStatus('');
    }

    // Test functions
    async function testDownload(signal) {
      setCardActive('download');
      showSpinner('download');
      setStatus('Testing download speed...');
      updateProgress('download', 0);

      const startTime = performance.now();
      const response = await fetch('/download', { signal });
      if (!response.ok) throw new Error('Download failed');

      const reader = response.body.getReader();
      const totalBytes = 100 * 1024 * 1024;
      let loaded = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        loaded += value.length;
        updateProgress('download', (loaded / totalBytes) * 100);
      }

      const duration = (performance.now() - startTime) / 1000;
      const mbps = ((loaded / duration) / (1024 * 1024)).toFixed(1);
      updateProgress('download', 100);
      showResult('download', mbps, 'Mbps', getSpeedQuality);
      return mbps;
    }

    async function testUpload(signal) {
      setCardActive('upload');
      showSpinner('upload');
      setStatus('Testing upload speed...');
      updateProgress('upload', 0);

      const fileSize = 99 * 1024 * 1024;
      const blob = new Blob([new ArrayBuffer(fileSize)], { type: 'application/octet-stream' });
      const formData = new FormData();
      formData.append('file', blob, 'speedtest.bin');

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        if (signal) {
          signal.addEventListener('abort', () => xhr.abort());
        }

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            updateProgress('upload', (e.loaded / e.total) * 100);
          }
        });

        const startTime = performance.now();

        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const duration = (performance.now() - startTime) / 1000;
            const mbps = ((fileSize / duration) / (1024 * 1024)).toFixed(1);
            updateProgress('upload', 100);
            showResult('upload', mbps, 'Mbps', getSpeedQuality);
            resolve(mbps);
          } else {
            reject(new Error('Upload failed'));
          }
        });

        xhr.addEventListener('error', () => reject(new Error('Upload failed')));
        xhr.addEventListener('abort', () => reject(new Error('Cancelled')));

        xhr.open('POST', '/upload');
        xhr.send(formData);
      });
    }

    async function testPing(signal) {
      setCardActive('ping');
      showSpinner('ping');
      setStatus('Testing ping...');
      updateProgress('ping', 0);

      const startTime = performance.now();
      const response = await fetch('/ping', { signal });
      if (!response.ok) throw new Error('Ping failed');
      const data = await response.json();
      if (data.server && !serverName) {
        serverName = data.server;
        serverInfo.textContent = 'Server: ' + serverName;
      }
      const ms = (performance.now() - startTime).toFixed(1);

      updateProgress('ping', 100);
      showResult('ping', ms, 'ms', getPingQuality);
      return ms;
    }

    async function testJitter(signal) {
      setCardActive('jitter');
      showSpinner('jitter');
      setStatus('Testing jitter...');
      updateProgress('jitter', 0);

      // Take multiple ping samples and compute variance
      const samples = [];
      const count = 5;
      for (let i = 0; i < count; i++) {
        const start = performance.now();
        const response = await fetch('/ping', { signal });
        if (!response.ok) throw new Error('Jitter test failed');
        await response.json();
        samples.push(performance.now() - start);
        updateProgress('jitter', ((i + 1) / count) * 100);
      }

      // Jitter = average absolute difference between consecutive samples
      let totalDiff = 0;
      for (let i = 1; i < samples.length; i++) {
        totalDiff += Math.abs(samples[i] - samples[i - 1]);
      }
      const jitter = (totalDiff / (samples.length - 1)).toFixed(1);

      showResult('jitter', jitter, 'ms', getJitterQuality);
      return jitter;
    }

    // Run a single test with guards
    async function runSingleTest(key, testFn) {
      if (isTesting) return;
      hideError();
      lastTestFn = () => runSingleTest(key, testFn);
      setTesting(true, 'Testing...');
      resetCard(key);

      try {
        await testFn(abortController.signal);
        copyBtn.classList.add('visible');
      } catch (err) {
        if (err.name === 'AbortError' || err.message === 'Cancelled') {
          setStatus('Test cancelled.');
          resetCard(key);
        } else {
          setCardError(key);
          showError('Test failed. Check your connection and try again.');
        }
      } finally {
        setCardActive(null);
        setTesting(false);
        if (!errorMsg.classList.contains('visible')) setStatus('');
      }
    }

    // Run all tests
    async function runAllTests() {
      if (isTesting) return;
      if (!navigator.onLine) {
        showError('You appear to be offline. Check your connection and try again.');
        return;
      }

      hideError();
      resetAll();
      lastTestFn = runAllTests;
      setTesting(true, 'Testing...');

      const tests = [
        ['download', testDownload],
        ['upload', testUpload],
        ['ping', testPing],
        ['jitter', testJitter]
      ];

      try {
        for (const [key, fn] of tests) {
          await fn(abortController.signal);
        }
        setStatus('All tests complete.');
        copyBtn.classList.add('visible');
      } catch (err) {
        if (err.name === 'AbortError' || err.message === 'Cancelled') {
          setStatus('Tests cancelled.');
        } else {
          showError('A test failed. Check your connection and try again.');
        }
      } finally {
        setCardActive(null);
        setTesting(false);
      }
    }

    // Event listeners
    allBtn.addEventListener('click', runAllTests);

    cancelBtn.addEventListener('click', () => {
      if (abortController) abortController.abort();
    });

    retryBtn.addEventListener('click', () => {
      hideError();
      if (lastTestFn) lastTestFn();
    });

    copyBtn.addEventListener('click', () => {
      const lines = ['Speed Test Results'];
      if (serverName) lines.push('Server: ' + serverName);
      const dl = cards.download.quality.textContent;
      const ul = cards.upload.quality.textContent;
      const pg = cards.ping.quality.textContent;
      const jt = cards.jitter.quality.textContent;
      if (dl) lines.push('Download: ' + cards.download.value.textContent);
      if (ul) lines.push('Upload: ' + cards.upload.value.textContent);
      if (pg) lines.push('Ping: ' + cards.ping.value.textContent);
      if (jt) lines.push('Jitter: ' + cards.jitter.value.textContent);
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy Results'; }, 2000);
      });
    });

    document.getElementById('downloadBtn').addEventListener('click', () => runSingleTest('download', testDownload));
    document.getElementById('uploadBtn').addEventListener('click', () => runSingleTest('upload', testUpload));
    document.getElementById('pingBtn').addEventListener('click', () => runSingleTest('ping', testPing));
    document.getElementById('jitterBtn').addEventListener('click', () => runSingleTest('jitter', testJitter));

    // Fetch server info on page load
    fetch('/ping').then(r => r.json()).then(data => {
      if (data.server) {
        serverName = data.server;
        serverInfo.textContent = 'Server: ' + serverName;
      }
    }).catch(() => {});
  </script>
</body>
</html>
